# FAST_LIO parameters for the Ouster OS-64 measurement rig (RTRI Okaya).
#
# Derived from src/FAST_LIO/config/ouster64.yaml, adjusted for this sensor and
# for the near-field scenes the rig records (everything within ~3 m).
#
# Extrinsics come from the /ouster/metadata recorded in the bag:
#   lidar_to_sensor_transform = R_z(180 deg), t = (0, 0, 38.195) mm
#   imu_to_sensor_transform   = I,            t = (-2.441, -9.725, 7.533) mm
# The driver publishes points in `os_lidar` and IMU in `os_imu`, so FAST_LIO
# needs T_imu_lidar = inv(T_sensor_imu) * T_sensor_lidar, i.e. a 180 deg yaw
# and a translation of (2.441, 9.725, 30.662) mm.
/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        # The scene spans ~0.5-3 m, so the 0.5 m voxels of the stock config
        # collapse it to a handful of cells. Keep the map at centimetre scale.
        filter_size_surf: 0.1
        filter_size_map: 0.1
        # Do NOT shrink this to the size of the scene. lasermap_fov_segment()
        # trims the local map whenever the sensor is within 1.5 * det_range of a
        # cube face, so cube_side_length must stay well above 3 * det_range or
        # the whole map is deleted every scan (no correspondences -> divergence).
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/ouster/points"
            imu_topic:  "/ouster/imu"
            time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 3                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR,
            scan_line: 128
            timestamp_unit: 3                 # 0-second, 1-milisecond, 2-microsecond, 3-nanosecond.
            # The sensor clips returns below ~0.54 m itself and the whole scene
            # sits inside 3 m; the stock blind of 4.0 discards every point.
            blind: 0.3

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     150.0
            extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
            extrinsic_T: [ 0.002441, 0.009725, 0.030662 ]
            extrinsic_R: [-1.,  0., 0.,
                           0., -1., 0.,
                           0.,  0., 1.]

        publish:
            path_en:  true
            scan_publish_en:  true       # false: close all the point cloud output
            dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan.
            scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

        pcd_save:
            # Keep this false. In this FAST_LIO revision the block in
            # publish_frame_world() that fills pcl_wait_save is commented out, so
            # the save buffer is always empty: the /map_save service then calls
            # PCDWriter on an empty cloud, throws pcl::IOException and aborts the
            # node. To capture a map, record /cloud_registered instead.
            pcd_save_en: false
            interval: -1                 # how many LiDAR frames saved in each pcd file;
                                         # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
